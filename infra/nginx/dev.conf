# Nginx config for dev environment
# Path on VM: /etc/nginx/sites-available/registration-dev
# Enable with: ln -s /etc/nginx/sites-available/registration-dev /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name dev.yourdomain.com;

    root /var/www/registration-app/frontend/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
